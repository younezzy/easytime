<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#202020"/>
      <stop offset="100%" style="stop-color:#2b2b2b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76b9ed"/>
      <stop offset="100%" style="stop-color:#60a5d6"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="8"/>
  
  <!-- Clock face markers -->
  <g stroke="#76b9ed" stroke-width="4" stroke-linecap="round">
    <!-- 12 o'clock -->
    <line x1="256" y1="50" x2="256" y2="80"/>
    <!-- 3 o'clock -->
    <line x1="462" y1="256" x2="432" y2="256"/>
    <!-- 6 o'clock -->
    <line x1="256" y1="462" x2="256" y2="432"/>
    <!-- 9 o'clock -->
    <line x1="50" y1="256" x2="80" y2="256"/>
  </g>
  
  <!-- Small hour markers -->
  <g fill="#76b9ed">
    <circle cx="256" cy="110" r="6"/>
    <circle cx="346" cy="136" r="6"/>
    <circle cx="402" cy="200" r="6"/>
    <circle cx="402" cy="312" r="6"/>
    <circle cx="346" cy="376" r="6"/>
    <circle cx="256" cy="402" r="6"/>
    <circle cx="166" cy="376" r="6"/>
    <circle cx="110" cy="312" r="6"/>
    <circle cx="110" cy="200" r="6"/>
    <circle cx="166" cy="136" r="6"/>
  </g>
  
  <!-- Hour hand -->
  <line x1="256" y1="256" x2="256" y2="150" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="380" y2="180" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Second hand -->
  <line x1="256" y1="256" x2="256" y2="100" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="256" cy="256" r="20" fill="url(#accentGrad)"/>
  <circle cx="256" cy="256" r="8" fill="#ffffff"/>
</svg>
