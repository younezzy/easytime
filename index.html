<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horloge Facile</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#76b9ed" />
    <meta name="description" content="Application d'horloge, minuteur, chronomètre et réveil" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Horloge Facile" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Horloge Facile" />
    <meta name="msapplication-TileColor" content="#202020" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Default Dark Mode */
        --bg-main: #202020;
        --bg-card: #2b2b2b;
        --bg-hover: #353535;
        --bg-modal: rgba(0, 0, 0, 0.6);
        --bg-popover: #202020;
        --border: #353535;
        --border-hover: #454545;
        --text-main: #ffffff;
        --text-muted: #9ca3af;
        --text-inverted: #000000;
        
        --accent: #76b9ed;
        --accent-hover: #60a5d6;
        
        --toggle-bg: #4a4a4a;
        --toggle-circle: #ffffff;
      }

      html.light {
        --bg-main: #f3f3f3;
        --bg-card: #ffffff;
        --bg-hover: #e5e5e5;
        --bg-modal: rgba(255, 255, 255, 0.6);
        --bg-popover: #ffffff;
        --border: #e5e5e5;
        --border-hover: #d1d1d1;
        --text-main: #1f1f1f;
        --text-muted: #6b7280;
        --text-inverted: #ffffff;
        
        --toggle-bg: #e5e5e5;
        --toggle-circle: #ffffff;
      }

      /* Reduced Motion */
      html.reduced-motion *,
      html.reduced-motion *::before,
      html.reduced-motion *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      body {
        font-family: 'Segoe UI', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        overflow: hidden; /* App-like feel */
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      /* Custom Scrollbar for Webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #555; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #777; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react",
    "framer-motion": "https://esm.sh/framer-motion@10.16.4?external=react,react-dom"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    // Enregistrement du Service Worker pour PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('Service Worker enregistré:', registration.scope);
          })
          .catch((error) => {
            console.log('Erreur Service Worker:', error);
          });
      });
    }
  </script>
</body>
</html>
